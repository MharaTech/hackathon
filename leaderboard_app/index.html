<!DOCTYPE html>
<html>
  <head>
    <title>Server Leaderboard</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
      body { font-family: Arial; background: #f3f3f3; text-align: center; }
      table { margin: 2rem auto; border-collapse: collapse; width: 60%; background: white; }
      th, td { padding: 10px; border: 1px solid #ccc; }
      th { background: #222; color: #fff; }
    </style>
  </head>
  <body>
    <h2>🚀 Live Server Leaderboard</h2>
    <table id="leaderboard">
      <tr><th>Rank</th><th>Server</th><th>Avg Latency (ms)</th><th>Requests</th></tr>
    </table>

    <script>
      const socket = io("http://localhost:8000");
      const table = document.getElementById("leaderboard");

      socket.on("leaderboard_update", (data) => {
        table.innerHTML = "<tr><th>Rank</th><th>Server</th><th>Avg Latency (ms)</th><th>Requests</th></tr>";
        data.forEach((entry, i) => {
          table.innerHTML += `<tr>
            <td>${i+1}</td>
            <td>${entry.server}</td>
            <td>${entry.avg_latency}</td>
            <td>${entry.requests}</td>
          </tr>`;
        });
      });
    </script>
  </body>
</html>
